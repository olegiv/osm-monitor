name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to commit SHAs so a repointed tag can't change CI code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install quality tools
        # All four tools are pinned to locally verified versions for
        # reproducible runs, and built via the Go module proxy
        # (sumdb-verified) — golangci-lint's release tarball checksum file
        # was inconsistent for fresh releases. Pinning govulncheck does not
        # stale its results: the vulnerability DB is fetched live from
        # vuln.go.dev on every run.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run all quality gates
        run: make check
